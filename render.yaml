# Render Blueprint: free API + free voice relay (ElevenLabs custom LLM). Render dashboard → New → Blueprint.
# Free web services sleep after ~15 min idle (background workers pause too) and wake on the next request.
services:
  - type: web
    name: rideout-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/render/api.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: prod
      - key: MONGODB_URI # not secret: the password is filled in from MONGODB_PASSWORD
        value: mongodb+srv://rideout:<db_password>@cluster0.7ozxkbz.mongodb.net/?retryWrites=true&w=majority&appName=Cluster0
      - key: MONGODB_PASSWORD
        sync: false # paste the Atlas password for user `rideout` when Render asks
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: PUBLIC_WEB_URL
        value: https://rideout-nine.vercel.app
      - key: GEMINI_API_KEY
        sync: false # optional; without it the free rule interpreter is used

  - type: web
    name: rideout-voice
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./voice/Dockerfile
    dockerContext: ./voice
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_API_URL # the API's Render URL (rideout-api.onrender.com belongs to someone else)
        value: https://rideout-api-grg6.onrender.com
      - key: INTERNAL_TOKEN
        fromService:
          type: web
          name: rideout-api
          envVarKey: INTERNAL_TOKEN
      - key: VOICE_LLM_SECRET # copy into the ElevenLabs agent's custom LLM API key (a workspace secret)
        generateValue: true
