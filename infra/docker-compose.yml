# Lives at /opt/rideout on the Vultr VM (copied there by .github/workflows/deploy.yml).
# /opt/rideout/.env      → DOMAIN, API_IMAGE, DEV_TAG, STAGING_TAG, PROD_TAG   (deploy.sh updates the tags)
# /opt/rideout/<env>.env → app secrets for that env (MONGODB_URI, GEMINI_API_KEY, ...). Never in git.
#
# `mongo` is a private single-node replica set on this VM (change streams for /live need a replica set).
# It has no published port: only the API containers reach it, as mongodb://mongo:27017/?replicaSet=rs0.
# An env uses it only if its <env>.env says so; an Atlas URI there keeps that env on Atlas.
name: rideout

x-api: &api
  restart: unless-stopped
  expose: ["8000"]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "3" }

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in /opt/rideout/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  mongo:
    image: mongo:7
    restart: unless-stopped
    # Small cache so it shares a 4 GB VM with three APIs. dev and staging get separate databases (ENV picks).
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.5"]
    expose: ["27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      # First run: start the replica set with the name the API containers resolve. Later runs: just check it.
      test: >-
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  api-dev:
    <<: *api
    image: ${API_IMAGE:-ghcr.io/yashpy/rideout-api}:${DEV_TAG:-latest}
    env_file: [./dev.env]
    environment: { ENV: dev }
    depends_on:
      mongo: { condition: service_healthy, required: false }

  api-staging:
    <<: *api
    image: ${API_IMAGE:-ghcr.io/yashpy/rideout-api}:${STAGING_TAG:-latest}
    env_file: [./staging.env]
    environment: { ENV: staging }
    depends_on:
      mongo: { condition: service_healthy, required: false }

  api-prod:
    <<: *api
    image: ${API_IMAGE:-ghcr.io/yashpy/rideout-api}:${PROD_TAG:-latest}
    env_file: [./prod.env]
    environment: { ENV: prod }

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
